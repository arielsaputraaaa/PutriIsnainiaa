<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buat Kamu</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#9aa6e6;--sky2:#cfd4fb;--ink:#1d1b3d;--pink:#ffb3cf;--pink2:#ff7fb0;--sun:#ffd23f;--paper:#fff;--night:#14122b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#6f79c4;--sky2:#9aa1e0}}
:root[data-theme="dark"]{--sky:#6f79c4;--sky2:#9aa1e0}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Gaegu','Comic Sans MS',cursive;color:var(--ink);background:var(--night);min-height:100vh;overflow-x:hidden}
/* play screen */
#start{position:fixed;inset:0;display:grid;place-items:center;background:var(--pink);background-image:radial-gradient(#fff8 3px,transparent 3.5px),radial-gradient(#ff7fb055 3px,transparent 3.5px);background-size:44px 44px;background-position:0 0,22px 22px;z-index:5;transition:opacity .5s,transform .5s}
#start.out{opacity:0;transform:scale(1.15);pointer-events:none}
#play{width:min(46vw,190px);aspect-ratio:1;border:6px solid var(--ink);border-radius:50%;background:var(--sun);cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 0 var(--ink);animation:bob 1.6s ease-in-out infinite}
#play svg{width:46%;margin-left:8%}
#play:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink);animation:none}
#play:focus-visible{outline:5px dashed var(--ink);outline-offset:8px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.sp{position:absolute;font-size:clamp(28px,6vw,54px);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.35) rotate(15deg)}}
/* dashboard */
#dash{display:none;position:relative;min-height:100vh;padding:28px 14px 0;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,var(--sky) 100%);overflow:hidden}
#dash.on{display:block;animation:in .6s ease-out}
@keyframes in{from{opacity:0}}
#dash:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#fff2 0 2px,transparent 2px 90px);pointer-events:none}
.wrap{position:relative;max-width:1180px;margin:0 auto;display:grid;gap:22px;grid-template-areas:"c" "l" "r";padding-bottom:70px}
.c{grid-area:c;text-align:center}.l{grid-area:l}.r{grid-area:r}
.side{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;align-content:start}
h1{font-size:clamp(34px,7vw,64px);line-height:1;color:#fff;font-weight:700;text-shadow:3px 3px 0 var(--ink);margin:6px 0 18px;transform:rotate(-2deg)}
.frame{background:var(--paper);padding:10px 10px 14px;border-radius:4px;box-shadow:0 10px 24px #1d1b3d55;transform:rotate(-.8deg);width:100%}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.vid iframe,.vid #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.note{font-size:clamp(20px,3.6vw,28px);color:#fff;margin-top:14px;text-shadow:2px 2px 0 var(--ink)}
.note a{color:var(--sun)}
.pol{background:var(--paper);padding:7px 7px 30px;border-radius:3px;box-shadow:0 8px 18px #1d1b3d55;transform:rotate(var(--r,0deg));position:relative}
.pol img{display:block;width:100%;aspect-ratio:var(--a,3/4);object-fit:cover;object-position:50% 25%}
.pol b{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:clamp(17px,3.2vw,22px);font-weight:700;line-height:1}
.tall img{aspect-ratio:auto;object-fit:contain}
.star{position:absolute;width:clamp(44px,8vw,90px);filter:drop-shadow(2px 3px 0 #1d1b3d55);animation:tw 3s ease-in-out infinite}
footer{position:relative;margin:0 -14px;padding:46px 20px 40px;background:radial-gradient(circle at 20% 0,#3a3670 0,transparent 55%),var(--night);color:#fff;text-align:center;font-size:clamp(22px,4.5vw,34px)}
footer:before{content:"";position:absolute;left:0;right:0;top:-30px;height:32px;background:var(--night);clip-path:polygon(0 100%,4% 30%,9% 80%,15% 20%,22% 70%,30% 10%,38% 75%,46% 25%,55% 80%,63% 15%,72% 70%,80% 25%,88% 80%,95% 30%,100% 100%)}
@media(min-width:900px){
 #dash{padding-top:40px}
 .wrap{grid-template-columns:1fr 2.3fr 1fr;grid-template-areas:"l c r";align-items:center;gap:30px}
 .side{grid-template-columns:1fr;gap:26px}
 .l .pol:nth-child(even){margin-left:24px}.r .pol:nth-child(odd){margin-left:24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
